<style>
:root{
  --green:#1f3b34; --green-2:#2c5047; --cream:#f7f0e3; --paper:#fffaf1; --ink:#2a2622; --muted:#7a6f63;
  --pink:#e8b4a0; --coral:#d9785f; --gold:#c9a15b; --line:#e8dcc6;
  --serif: "Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans: -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4;
  padding-bottom:calc(32px + env(safe-area-inset-bottom))}
button,textarea{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* Header: echoes the PDF's black-framed title card */
header.hero{background:var(--green);color:var(--cream);padding:calc(18px + env(safe-area-inset-top)) 16px 22px;text-align:center}
.frame{max-width:528px;margin:0 auto;border:2px solid var(--cream);outline:1px solid rgba(247,240,227,.35);outline-offset:4px;border-radius:6px;padding:18px 14px 16px}
.hero svg{width:44px;height:44px;display:block;margin:0 auto 6px}
.hero h1{font-family:var(--serif);font-weight:700;font-size:clamp(30px,9vw,42px);letter-spacing:.06em;text-transform:uppercase;margin:0;line-height:1.05}
.hero .sub{margin:8px 0 0;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--pink)}

/* Rules banner */
.rules{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px auto 0;max-width:528px}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(247,240,227,.12);border:1px solid rgba(247,240,227,.3);border-radius:999px;padding:6px 12px;font-size:14px}
.chip b{font-weight:600}

/* Sticky progress */
.progress{position:sticky;top:0;z-index:10;background:rgba(247,240,227,.94);-webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);padding:10px 0 12px;padding-top:max(10px, env(safe-area-inset-top))}
.progress .row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.progress .count{font-family:var(--serif);font-size:20px;font-weight:700}
.progress .count small{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--muted);margin-left:4px}
.progress .pct{font-size:13px;color:var(--muted)}
.bar{height:10px;border-radius:999px;background:#eadfca;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--coral),var(--gold));border-radius:999px;transition:width .35s ease}

/* Neighborhood nav */
nav.hoods{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav.hoods::-webkit-scrollbar{display:none}
nav.hoods a{flex:0 0 auto;text-decoration:none;font-size:14px;padding:7px 12px;border-radius:999px;background:var(--paper);border:1px solid var(--line);white-space:nowrap}
nav.hoods a span{color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}

section.hood{padding-top:18px;scroll-margin-top:84px}
.hood-head{display:flex;align-items:baseline;justify-content:space-between;margin:6px 2px 10px}
.hood-head h2{font-family:var(--serif);font-size:24px;margin:0;color:var(--green)}
.hood-head .tally{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* Stop cards */
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;margin-bottom:10px;box-shadow:0 1px 0 rgba(31,59,52,.04),0 6px 16px -12px rgba(31,59,52,.35);transition:background .2s,border-color .2s}
.card.done{background:#eef3ec;border-color:#cfdccd}
.top{display:flex;gap:12px;align-items:flex-start}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--green);color:var(--cream);font-size:13px;font-weight:600;display:grid;place-items:center;margin-top:2px;font-variant-numeric:tabular-nums}
.card.done .num{background:var(--coral)}
.info{flex:1;min-width:0}
.name{font-family:var(--serif);font-size:20px;font-weight:700;margin:0;line-height:1.2}
.card.done .name{text-decoration:line-through;text-decoration-color:rgba(217,120,95,.7);text-decoration-thickness:2px}
.rec{margin:3px 0 0;font-size:15px;color:var(--ink)}
.rec em{font-style:normal;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);font-weight:700;margin-right:6px}

.actions{display:flex;gap:8px;margin-top:12px}
.btn{appearance:none;border:1px solid var(--line);background:#fff;border-radius:10px;min-height:44px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.98)}
.btn.done-btn{flex:1}
.btn.done-btn[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--cream)}
.btn.dir{flex:1;color:var(--green)}
.btn svg{width:18px;height:18px}

.extras{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.stars{display:flex;gap:0}
.star{appearance:none;background:none;border:0;padding:4px;width:40px;height:40px;cursor:pointer;color:#d8ccb6;-webkit-tap-highlight-color:transparent}
.star svg{width:26px;height:26px;display:block;margin:auto}
.star.on{color:var(--gold)}
.note-toggle{appearance:none;background:none;border:0;color:var(--muted);font-size:14px;padding:8px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.note-toggle.has{color:var(--green);font-weight:600}
textarea{display:block;width:100%;margin-top:8px;min-height:64px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px;font-size:16px;resize:vertical}
textarea:focus,.btn:focus-visible,.star:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
textarea[hidden]{display:none}

footer{margin-top:28px;text-align:center;color:var(--muted);font-size:13px}
.reset{margin:0 auto 12px;color:#9b3d2a;border-color:#e7c3b7;background:transparent}
.done-banner{display:none;margin:14px 0 0;background:var(--green);color:var(--cream);border-radius:14px;padding:16px;text-align:center;font-family:var(--serif);font-size:20px}
.done-banner.show{display:block}
</style>
</head>
